aid: prokarium
name: Prokarium
description: 'Prokarium is a clinical-stage biopharmaceutical company headquartered in London,
  UK, developing bacterial immunotherapies for solid tumors. Its foundational technology uses
  a proprietary attenuated strain of Salmonella enterica serovar Typhi (ZH9) as a microbial
  immunotherapy platform that is naturally tumor-targeting and oncolytic, designed to overcome
  the suppressive tumor microenvironment and generate anti-tumor immune responses while enabling
  diverse cargo delivery. The lead program, ZH9 for non-muscle invasive bladder cancer, is in
  the Phase 1/1b PARADIGM-1 trial, with a muscle-invasive bladder cancer combination arm
  alongside checkpoint inhibitors, an oral immune fitness agent (IO Prime), and a discovery-stage
  Living Cures cargo-delivery platform. Prokarium is a therapeutics developer, not a software
  or data company, and publishes no public API, SDK, developer portal or machine-readable
  interface of any kind.'
